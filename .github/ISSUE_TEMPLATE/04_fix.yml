name: 'Fix'
description: '서비스 동작 중 발견한 문제를 Task 성격의 수정 이슈로 등록합니다.'
title: ''
body:
  - type: markdown
    attributes:
      value: |
        > **제목 작성 가이드**
        > `fix(${primary-context}): ${detailed-description}`
        >
        > 예시
        > - `fix(account): 카카오 로그인 이메일 매핑 오류 수정`
        > - `fix(profile): 프로필 이미지 기본값 조회 오류 수정`
        >
        > 긴급 운영 수정이라면 제목은 그대로 `fix(...)`를 사용하고, 이슈 생성 후 `hotfix` 라벨을 추가해주십시오.

  - type: input
    id: primary-context
    attributes:
      label: Primary Context
      description: 주도하는 컨텍스트를 작성해주십시오.
      placeholder: "예: account, profile, policy, storage, cross-context"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 발생한 문제를 간략하고 명확하게 설명해주십시오.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 경로
      description: 버그를 재현하기 위한 순서를 작성해주십시오.
      placeholder: |
        1. 카카오 로그인 버튼을 클릭합니다.
        2. OAuth 인증을 완료합니다.
        3. 로그인 직후 사용자 조회 API를 호출합니다.
        4. 이메일 매핑 오류가 발생합니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적이라면 어떤 동작을 해야 하는지 작성해주십시오.
      placeholder: 로그인 성공 후 사용자 이메일이 정상적으로 매핑되어야 합니다.

  - type: textarea
    id: environment
    attributes:
      label: 환경 정보
      description: 버그 재현 환경을 작성해주십시오.
      placeholder: |
        - Environment: local / dev / prod
        - OS: macOS 15
        - Browser / Client: Chrome 134
        - Version: v0.0.0

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷
      description: 에러 로그나 화면 캡처가 있다면 첨부해주십시오.

  - type: markdown
    attributes:
      value: |
        ---

        **반드시 다음 항목을 확인해주십시오.**
        - [ ] 제목을 `fix(${primary-context}): ...` 형식으로 작성해주십시오.
        - [ ] Issue Type을 `Task`로 설정해주십시오.
        - [ ] Milestone을 설정해주십시오.
        - [ ] Assignees를 설정해주십시오. 담당자가 없다면 비워둘 수 있으나, 다음 회의에서 담당자를 정해주십시오.
        - [ ] Project를 지정해주십시오.
        - [ ] 이슈 생성 후 Project 속성값 `Type`, `Primary Context`, `Status`, `Priority`를 입력해주십시오.
        - [ ] 긴급 운영 수정이라면 `hotfix` 라벨을 추가해주십시오.
        - [ ] 버그 영향도가 크다면 팀 채널에 이슈 링크와 요약 정보를 즉시 공유해주십시오.
