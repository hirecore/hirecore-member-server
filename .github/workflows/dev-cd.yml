name: dev-cd

# =========================
# 1) 언제 이 workflow를 실행할 것인가
# =========================
on:
  # dev 브랜치에 push 되면 자동 실행
  push:
    branches:
      - dev

  # GitHub Actions 화면에서 수동 실행도 가능
  workflow_dispatch:

# =========================
# 2) GitHub Actions가 가져야 할 최소 권한
# =========================
permissions:
  # 저장소 코드를 checkout 하기 위해 필요
  contents: read

  # OIDC 방식으로 AWS Role을 Assume 하기 위해 필요
  id-token: write

# =========================
# 3) 중복 실행 제어
# =========================
concurrency:
  # 같은 dev-cd 그룹의 workflow가 동시에 돌지 않도록 제어
  group: dev-cd

  # 이전 실행이 아직 끝나지 않았으면 취소하고 최신 실행만 유지
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, Push and Deploy

    # 이 job 전체는 GitHub가 제공하는 Ubuntu 러너에서 실행된다.
    runs-on: ubuntu-latest

    # 너무 오래 걸리면 40분 후 강제 종료
    timeout-minutes: 40
    environment: dev

    # =========================
    # 4) GitHub Variables -> workflow 공통 env 매핑
    # =========================
    # 여기서 한 번 env로 꺼내 두면,
    # 이후 step에서 ${{ env.xxx }} 또는 shell의 $XXX 형태로 재사용하기 쉬워진다.
    # [개념]
    #  - ${{..}} == GitHub Actions 표현식이다.
    #  - ${{..}}가 steps 같은곳에서 그대로 사용된다면, GitHub Actions가 먼저 문자열로 치환하고 전달함을 기억한다.defaults:
    #    반면, ${..}로 사용되면 시스템의 환경변수의 값으로 들어가 있는 값을 사용하는 형태로 이해하면 된다.
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      SSM_TARGET_TAG_KEY: ${{ vars.SSM_TARGET_TAG_KEY }}
      SSM_TARGET_TAG_VALUE: ${{ vars.SSM_TARGET_TAG_VALUE }}

    steps:
      # =========================
      # 5) 저장소 코드 내려받기
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 6) Java 21 설치
      # =========================
      # Spring Boot 프로젝트를 빌드할 수 있도록 JDK 준비
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # =========================
      # 7) Gradle 환경 준비
      # =========================
      # Gradle 캐시 등을 설정하여 빌드 효율을 높임
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # =========================
      # 8) gradlew 실행 권한 부여
      # =========================
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      # =========================
      # 9) 애플리케이션 빌드 + 테스트
      # =========================
      # clean      : 이전 빌드 결과 제거
      # test       : 테스트 수행
      # bootJar    : 실행 가능한 Spring Boot Jar 생성
      - name: Build and test
        run: ./gradlew clean test bootJar

      # =========================
      # 10) AWS 인증 획득
      # =========================
      # 여기서 "AWS에 로그인해서 모든 걸 다 한다"가 아니라,
      # 지정한 IAM Role(AWS_ROLE_TO_ASSUME)을 OIDC 방식으로 Assume 한다.
      # 즉, 이 이후 step들은 "그 Role이 허용한 범위 안에서만" AWS API 호출이 가능하다.
      #
      # [동작 정리]
      #  1. audience = 따로 지정하지 않으면, 기본적으로 "sts.amazonaws.com"이 사용된다.
      #
      # [참고사항]
      #  1. (github) aws-actions/confugure-aws-credentials: https://github.com/aws-actions/configure-aws-credentials?utm_source=chatgpt.com
      #  2. (github) AWS OIDC 구성방법 = https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-aws?utm_source=chatgpt.com
      #  3.
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # workflow env 값을 action input으로 전달
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      # =========================
      # 11) ECR 로그인
      # =========================
      # 이 step은 "ECR 내부로 들어간다"는 뜻이 아니라,
      # 러너의 Docker 클라이언트가 ECR Registry에 인증된 상태가 되도록 만든다.
      # 이후 docker push 가 가능해진다.
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # =========================
      # 12) 이번 배포용 Docker 이미지 정보 생성
      # =========================
      # 예:
      #   IMAGE_TAG = dev-a1b2c3d
      #   IMAGE_URI = <account>.dkr.ecr.<region>.amazonaws.com/<repo>:dev-a1b2c3d
      #
      # 이렇게 만든 값은 GITHUB_OUTPUT에 저장해
      # 다음 step에서 steps.image.outputs.xxx 로 꺼내 쓸 수 있게 한다.
      - name: Set image metadata
        id: image
        run: |
          IMAGE_TAG="dev-${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          SHORT_COMMENT_INFO="$ap-northeast-2.amazonaws.com/{ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "short_comment_info=${SHORT_COMMENT_INFO}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      # =========================
      # 13) Docker 이미지 빌드
      # =========================
      # 현재 저장소 루트를 build context 로 사용하고,
      # docker/Dockerfile 기준으로 이미지를 생성한다.
      - name: Build Docker image
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          docker build \
            -f docker/Dockerfile \
            -t "${IMAGE_URI}" \
            .

      # =========================
      # 14) Docker 이미지 ECR에 push
      # =========================
      # 여기까지는 전부 GitHub Actions 러너에서 수행된다.
      # 아직 EC2에는 배포 명령이 가지 않았다.
      - name: Push Docker image
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          docker push "${IMAGE_URI}"

      # =========================
      # 15) EC2에서 실행할 "원격 배포 스크립트" 준비
      # =========================
      # 핵심 목적:
      #   - docker-compose.dev.yml 내용을 문자열(base64)로 포장
      #   - deploy-dev.sh 내용을 문자열(base64)로 포장
      #   - EC2에서 실행할 remote-deploy.sh 스크립트를 생성
      #
      # 이 시점에도 아직 EC2에 보낸 것은 아니다.
      # "보낼 준비물"을 러너에서 만드는 단계다.
      - name: Prepare remote deployment files
        id: remote
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          set -Eeuo pipefail

          # compose 파일과 배포 스크립트를 base64로 인코딩
          # 이유: 여러 줄 파일 내용을 원격 명령에 안전하게 실어 보내기 위함
          COMPOSE_B64="$(base64 -w 0 docker/dev/docker-compose.dev.yml)"
          DEPLOY_B64="$(base64 -w 0 docker/dev/deploy-dev.sh)"

          # EC2에서 실제로 실행될 스크립트 생성
          cat > remote-deploy.sh <<EOF
          #!/usr/bin/env bash
          set -Eeuo pipefail

          # EC2 내부 배포 디렉토리 생성
          DEPLOY_DIR="${DEPLOY_DIR}"
          mkdir -p "\${DEPLOY_DIR}"

          # base64 문자열을 다시 원본 파일로 복원
          # echo를 사용하지 않은 이유는, 문자열 그대로 처리하기 위함. echo는 줄바꿈을 포함한다.
          printf '%s' '${COMPOSE_B64}' | base64 -d > "\${DEPLOY_DIR}/docker-compose.dev.yml"
          printf '%s' '${DEPLOY_B64}' | base64 -d > "\${DEPLOY_DIR}/deploy-dev.sh"
          chmod +x "\${DEPLOY_DIR}/deploy-dev.sh"

          # 이번 배포에서 사용할 동적 값(이미지 URI 등)을 env 파일로 생성
          # deploy-dev.sh 와 docker compose 가 이 값을 읽어 사용할 수 있다.
          # here-document: EOF가 사용되었기 때문에 DEPLOY_ENV로 작성해서 사용한다.
          cat > "\${DEPLOY_DIR}/.env.dev.deploy" <<'DEPLOY_ENV'
          AWS_REGION=${AWS_REGION}
          APP_IMAGE=${IMAGE_URI}
          DEPLOY_ENV

          # 배포 디렉토리로 이동 후 실제 배포 스크립트 실행
          cd "\${DEPLOY_DIR}"
          bash ./deploy-dev.sh
          EOF

          # 위에서 만든 remote-deploy.sh 자체도
          # 나중에 SSM 명령으로 전달하기 위해 base64 로 다시 포장
          REMOTE_SCRIPT_B64="$(base64 -w 0 remote-deploy.sh)"
          echo "remote_script_b64=${REMOTE_SCRIPT_B64}" >> "$GITHUB_OUTPUT"

      # =========================
      # 16) SSM으로 EC2에 배포 명령 전송
      # =========================
      # 여기서 처음으로 "실제 SSM 사용"이 일어난다.
      #
      # 구조는 다음과 같다:
      #   GitHub Actions Runner
      #     -> AWS SSM API 호출(send-command)
      #     -> 태그가 일치하는 EC2 대상 선택
      #     -> EC2 내부의 SSM Agent 가 명령 실행
      #
      # 즉, 러너가 EC2에 직접 SSH 접속하는 구조가 아니다.
      - name: Send deployment command via SSM
        id: ssm
        env:
          REMOTE_SCRIPT_B64: ${{ steps.remote.outputs.remote_script_b64 }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          SHORT_COMMENT_INFO: ${{steps.image.outputs.short_comment_info}}

        # https://docs.aws.amazon.com/cli/latest/reference/ssm/send-command.html 참고
        run: |
          set -Eeuo pipefail

          # SSM send-command 에 넘길 JSON payload 생성
          python - <<'PY' > ssm-send-command.json
          import json
          import os

          payload = {
              "DocumentName": "AWS-RunShellScript",
              "Targets": [
                  {
                      # 예: tag:Name = hirecore-member-server-dev
                      # 이 조건에 맞는 EC2가 명령 대상이 된다.
                      "Key": f"tag:{os.environ['SSM_TARGET_TAG_KEY']}",
                      "Values": [os.environ["SSM_TARGET_TAG_VALUE"]]
                  }
              ],
              "Parameters": {
                  "commands": [
                      # base64 로 포장한 remote script 를 EC2 내부 /tmp 경로에 복원
                      f"printf '%s' '{os.environ['REMOTE_SCRIPT_B64']}' | base64 -d > /tmp/hirecore-dev-remote.sh",

                      # 복원한 스크립트 실행
                      "bash /tmp/hirecore-dev-remote.sh"
                  ]
              },
              # 콘솔/로그 상에서 이번 명령이 어떤 배포였는지 식별하기 위한 설명
              "Comment": f"Deploy {os.environ['SHORT_COMMENT_INFO']}"
          }

          print(json.dumps(payload))
          PY

          # 실제 SSM 명령 전송
          # 성공하면 CommandId 를 반환하며,
          # 이후 step 에서 이 ID 로 결과를 조회한다.
          COMMAND_ID="$(aws ssm send-command \
            --cli-input-json file://ssm-send-command.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      # =========================
      # 17) SSM 명령 결과 대기
      # =========================
      # send-command 는 "명령 전달"만 한 상태이므로,
      # 실제 EC2에서 성공/실패했는지 여기서 반복 조회한다.
      - name: Wait for SSM command result
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -Eeuo pipefail

          # 최대 60번 조회
          # Pending / InProgress 면 잠시 대기 후 다시 확인
          for _ in {1..60}; do
            STATUS="$(aws ssm list-command-invocations \
              --command-id "${COMMAND_ID}" \
              --details \
              --query 'CommandInvocations[0].Status' \
              --output text)"

            echo "Current SSM status: ${STATUS}"

            case "${STATUS}" in
              # EC2에서 원격 스크립트 실행까지 성공적으로 끝남
              Success)
                exit 0
                ;;

              # 실패 상태면 상세 조회 후 workflow 자체도 실패 처리
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm list-command-invocations \
                  --command-id "${COMMAND_ID}" \
                  --details
                exit 1
                ;;

              # 아직 처리 중이면 10초 후 재조회
              Pending|InProgress|Delayed)
                sleep 10
                ;;

              # 예상 밖 상태값이면 짧게 대기 후 다시 확인
              *)
                sleep 5
                ;;
            esac
          done

          # 정해진 시간 안에 끝나지 않으면 타임아웃 실패 처리
          echo "SSM command did not finish in time."
          aws ssm list-command-invocations \
            --command-id "${COMMAND_ID}" \
            --details
          exit 1
