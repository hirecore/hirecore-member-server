plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'

	// [New] REST Docs 테스트 결과를 OpenAPI 3.0 스펙(JSON/YAML)으로 변환하는 플러그인
	id 'com.epages.restdocs-api-spec' version '0.19.4'

	// [New] 변환된 OpenAPI 스펙을 기반으로 Swagger UI를 생성해주는 플러그인
	id 'org.hidetake.swagger.generator' version '2.19.2'
}

group = 'io.hirecore'
version = '0.0.1-SNAPSHOT'
description = 'hirecore-member-server'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// OpenAPI 3.0 스펙 생성 설정 (Swagger 문서의 메타정보)
openapi3 {
	server = 'http://localhost:8080'
	title = 'hirecore-member-server-api'
	description = 'hirecore-member-server의 API 명세서입니다.'
	version = '0.0.1'
	format = 'yaml' // yaml 또는 json 포맷 지원
}

dependencies {
	// =================================================================================
	// 1. 웹 & 시큐리티 계층 (Web & Security Layer)
	// =================================================================================
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// =================================================================================
	// 2. 영속성 계층 (Persistence Layer - Database & JPA)
	// =================================================================================
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j' // 운영 환경용 드라이버
	runtimeOnly 'com.h2database:h2'             // 테스트/로컬 개발용 드라이버

	// =================================================================================
	// 3. 유틸리티 & 도구 (Utilities & Tools)
	// =================================================================================
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// MapStruct (객체 매핑 도구 - Lombok 호환 설정 포함)
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3', 'org.projectlombok:lombok', "org.projectlombok:lombok-mapstruct-binding:0.2.0"

	// JWT (JSON Web Token) 처리 라이브러리
	implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

	// 로깅 (Logstash 인코더 - ELK 스택 연동용)
	implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

	//
	implementation 'com.github.f4b6a3:tsid-creator:5.2.6'

	// =================================================================================
	// 4. 테스트 & 문서화 전략 (Testing & Documentation Strategy)
	// =================================================================================
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'          // 시큐리티 테스트 지원

	// Spring REST Docs MockMvc: Spring REST Docs 코어 (MockMvc 확장 기능 사용을 위해 필수)
	// https://mvnrepository.com/artifact/org.springframework.restdocs/spring-restdocs-mockmvc
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'

	// REST Doc API Spec MockMVC: REST Docs와 OpenAPI 스펙 연동 라이브러리 (Swagger UI 생성을 위해 필수)
	// https://mvnrepository.com/artifact/com.epages/restdocs-api-spec-mockmvc
	testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.19.4'

	// Swagger UI WebJar: API 시각화를 위한 정적 리소스
	// https://mvnrepository.com/artifact/org.webjars/swagger-ui
	swaggerUI 'org.webjars:swagger-ui:5.10.3'

	// ArchUnit: 아키텍처 규칙 검증
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'

	// Fixture Monkey: 테스트 객체 자동 생성
	testImplementation 'com.navercorp.fixturemonkey:fixture-monkey-starter:1.1.15'

	// Junit Launcher: Junit실행기
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 태스크: 생성된 OpenAPI YAML 파일을 Swagger UI가 접근할 수 있는 정적 경로로 복사
// 로컬 개발(bootRun) 시 접근 URL: http://localhost:8080/docs/openapi3.yaml
tasks.register('copySwaggerUI', Copy) {
	dependsOn 'openapi3' // openapi3 태스크가 먼저 실행되어야 함
	from("build/api-spec/openapi3.yaml")
	into("src/main/resources/static/docs")
}

// 패키징(bootJar) 실행 전에 openapi3.yaml을 JAR에 직접 포함
// processResources보다 늦게 생성되므로 bootJar에 직접 추가한다
tasks.named('bootJar') {
	dependsOn 'copySwaggerUI'
	from("build/api-spec/openapi3.yaml") {
		into("BOOT-INF/classes/static/docs")
	}
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// [수정] 모든 설정이 완료된 후(afterEvaluate)에 태스크를 찾도록 변경
afterEvaluate {
	tasks.named('openapi3') {
		dependsOn 'test'
	}
}
