services:
  app:
    image: ${APP_IMAGE}
    container_name: hirecore-member-server-app-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev.app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: UTC
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0.36
    container_name: hirecore-member-server-mysql-dev
    restart: unless-stopped
    env_file:
      - ./.env.dev.mysql
    environment:
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - hirecore-member-server-dev-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  hirecore-member-server-dev-mysql-data:
    name: hirecore-member-server-dev-mysql-data