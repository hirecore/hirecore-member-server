name: hirecore-member-server-local

services:
  mysql:
    image: mysql:8.4.8
    container_name: hirecore-member-server-mysql-local
    ports:
      - "3307:3306"
    env_file:
      - ./.env.local.mysql
    environment:
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - hirecore-member-server-local-mysql-data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    container_name: hirecore-member-server-minio-local
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ./.env.local.minio
    command: server /data --console-address ":9001"
    volumes:
      - hirecore-member-server-local-minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: hirecore-member-server-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/hirecore-member-server-local;
      mc anonymous set download local/hirecore-member-server-local;
      echo 'MinIO init complete';
      "

volumes:
  hirecore-member-server-local-mysql-data:
    name: hirecore-member-server-local-mysql-data
  hirecore-member-server-local-minio-data:
    name: hirecore-member-server-local-minio-data
