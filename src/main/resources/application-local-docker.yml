spring:
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}

  sql:
    init:
      mode: always

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC
    defer-datasource-initialization: true

hirecore:
  cors:
    allowed-origins:
      - ${LOCAL_CORS_ALLOWED_ORIGIN}
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "*"
    allow-credentials: true

  cookie:
    http-only: true
    secure: false
    same-site: Lax

  jwt:
    secret: ${LOCAL_JWT_SECRET}
    access-expiration-millis: 10800000  # 임시 3시간 => 개발/운영 환경에서 변경 필요
    refresh-expiration-millis: 604800000 # 임시 7일 => 개발/운영 환경에서 변경 필요

  oauth2:
    kakao:
      client-redirect-url: ${LOCAL_OAUTH2_KAKAO_CLIENT_REDIRECT_URL}
      client-id: ${LOCAL_OAUTH2_KAKAO_CLIENT_ID}
      client-secret: ${LOCAL_OAUTH2_KAKAO_CLIENT_SECRET}
      grant-type: authorization_code
      token-issue-url: https://kauth.kakao.com/oauth/token
      user-profile-url: https://kapi.kakao.com/v2/user/me

  object-storage:
    aws:
      region: ${LOCAL_OBJECT_STORAGE_AWS_REGION}
      s3:
        bucket: ${LOCAL_OBJECT_STORAGE_AWS_S3_BUCKET}
        path-style-access: true
        endpoint: ${LOCAL_OBJECT_STORAGE_AWS_S3_ENDPOINT}
        access-key: ${LOCAL_OBJECT_STORAGE_AWS_S3_ACCESS_KEY}
        secret-key: ${LOCAL_OBJECT_STORAGE_AWS_S3_SECRET_KEY}
      cloud-front:
        public-base-url: ${LOCAL_OBJECT_STORAGE_AWS_CF_PUBLIC_BASE_URL}