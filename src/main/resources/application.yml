server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  threads:
    virtual:
      enabled: true

  jackson:
    mapper:
      allow-coercion-of-scalars: false
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

hirecore:
  object-storage:
    aws:
      s3:
        presigned-expiration-minutes: 3

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: OFF